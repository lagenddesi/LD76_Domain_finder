name: Daily Domain Scanner

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    name: Run LD76 Domain Finder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scanner/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner/requirements.txt

      - name: Run Scanner Engine
        env:
          # --------------------------------------------------
          # Domain discovery
          # --------------------------------------------------
          DOMAIN_TLD: "top"
          DISCOVERY_LIMIT: "200"

          # --------------------------------------------------
          # Website scanning
          # --------------------------------------------------
          REQUEST_TIMEOUT: "8"
          CRTSH_TIMEOUT: "30"
          MAX_RESPONSE_BYTES: "2097152"

          # --------------------------------------------------
          # Python filtering
          # --------------------------------------------------
          PYTHON_MIN_SCORE: "60"
          PYTHON_RESULT_SCORE: "80"

          SCAN_DELAY: "0.25"

          SCANNER_USER_AGENT: "LD76-Domain-Finder/1.0 (+domain-security-research)"

          # --------------------------------------------------
          # Gemini
          # --------------------------------------------------
          ENABLE_GEMINI: "true"
          GEMINI_FORCE_REANALYSIS: "false"

          GEMINI_MODEL: "gemini-2.5-flash"

          # Hard limits
          GEMINI_DAILY_LIMIT: "50"
          GEMINI_MAX_REQUESTS: "10"

          # Queue controls
          GEMINI_CONCURRENCY: "2"
          PYTHON_GEMINI_THRESHOLD: "80"
          GEMINI_REQUEST_DELAY: "2.0"

          # Evidence limits
          GEMINI_MAX_EVIDENCE_ITEMS: "12"
          GEMINI_MAX_EVIDENCE_CHARS: "4500"

          # --------------------------------------------------
          # Gemini API key
          # --------------------------------------------------
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          python scanner/scanner.py

      - name: Verify Scanner Output
        run: |
          echo "=== data directory ==="
          ls -lah data/

          echo
          echo "=== results.json ==="
          if [ -f data/results.json ]; then
            python -m json.tool data/results.json > /dev/null
            echo "results.json: valid JSON"
          else
            echo "results.json: NOT FOUND"
            exit 1
          fi

          echo
          echo "=== scan_history.json ==="
          if [ -f data/scan_history.json ]; then
            python -m json.tool data/scan_history.json > /dev/null
            echo "scan_history.json: valid JSON"
          else
            echo "scan_history.json: not created"
          fi

          echo
          echo "=== gemini_cache.json ==="
          if [ -f data/gemini_cache.json ]; then
            python -m json.tool data/gemini_cache.json > /dev/null
            echo "gemini_cache.json: valid JSON"
          else
            echo "gemini_cache.json: not created"
          fi

      - name: Commit and Push Results
        run: |
          git config user.name "Domain-Bot"
          git config user.email "bot@github.com"

          git add data/results.json
          git add data/scan_history.json
          git add data/gemini_cache.json

          if git diff --cached --quiet; then
            echo "No scanner data changes to commit."
          else
            git commit -m "Auto-update: Domain scanner results"
            git push
          fi
