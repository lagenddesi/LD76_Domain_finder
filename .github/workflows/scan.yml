name: Daily Domain Scanner

on:
  schedule:
    # Rozana subah Pakistani waqt ke mutabiq khud chalega
    - cron: '0 3 * * *'
  workflow_dispatch: # Taake aap jab chahein button daba kar bhi manually chala sakein

permissions:
  contents: write # Taake script results.json ko repo mein save kar sake

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r scanner/requirements.txt

      - name: Run Scanner Engine
        run: |
          python scanner/scanner.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "Domain-Bot"
          git config --global user.email "bot@github.com"
          git add data/results.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: New domains detected" && git push)
